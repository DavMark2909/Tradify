server:
    port: 8082

spring:
    application:
        name: resource-server
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8079
    jpa:
        hibernate:
            ddl-auto: validate
    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration