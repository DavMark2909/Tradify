server:
  port: 8081

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  session:
    store-type: redis
  security:
    oauth2:
      client:
        registration:
          gateway-client:
            provider: spring-auth-server
            client-id: gateway-client #should match the config from the auth server
            client-secret: psw
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile
        provider:
          spring-auth-server:
            issuer-uri: http://localhost:8079
  cloud:
    gateway:
      default-filters:
        - TokenRelay
      server:
        webmvc:
          routes:


